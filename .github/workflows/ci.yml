name: Docker Web Project CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f Dockerfile
          test -f compose.yaml
          test -f index.html
          test -f README.md

      - name: Validate Docker Compose
        run: docker compose config -q

      - name: Build Docker image
        run: docker build -t docker-web-project-test .

  deploy:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            essawxwx1/docker-web-project:latest
            essawxwx1/docker-web-project:${{ github.sha }}

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::991299034428:role/GitHubActions-SSM-Deploy-Role
          aws-region: eu-north-1

      - name: Deploy to EC2 using SSM
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-04a2dcd962c8c267b \
            --document-name AWS-RunShellScript \
            --comment "GitHub Actions Docker deployment" \
            --parameters "commands=[
              \"set -e\",
              \"sudo docker pull essawxwx1/docker-web-project:${IMAGE_TAG}\",
              \"sudo docker rm -f essa-web-app || true\",
              \"sudo docker run -d --name essa-web-app -p 8080:80 --restart unless-stopped essawxwx1/docker-web-project:${IMAGE_TAG}\"
            ]" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-04a2dcd962c8c267b

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-04a2dcd962c8c267b \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json
