name: Docker Web Project CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f Dockerfile
          test -f compose.yaml
          test -f index.html
          test -f README.md

      - name: Validate Docker Compose
        run: docker compose config -q

      - name: Build Docker image
        run: docker build -t docker-web-project-test .

  deploy:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            essawxwx1/docker-web-project:latest
            essawxwx1/docker-web-project:${{ github.sha }}

      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker pull essawxwx1/docker-web-project:${{ github.sha }}
            sudo docker rm -f essa-web-app || true
            sudo docker run -d --name essa-web-app -p 8080:80 --restart unless-stopped essawxwx1/docker-web-project:${{ github.sha }}
